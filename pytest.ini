[pytest]
# `--dist loadgroup` takes effect only if the tests are run in parallel (with the
# `-n` option of pytest-xdist, for example `-n auto`).
addopts = -rxXs --strict-markers --doctest-modules --capture=no --dist loadgroup

testpaths =
    tests
    src/market_prices/helpers.py
    src/market_prices/utils/pandas_utils.py
    src/market_prices/utils/general_utils.py

markers =
    slow: intensive test (NB deselect with '-m "not slow"')
    fast_substitute: limited substitute for a slow test
