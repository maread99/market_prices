name: Build and test

on:
  pull_request:
    branches:
      - master
    # The workflow is skipped if every file that the pull request changes matches
    # one of these patterns. A change to any of these files cannot affect the tests.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - ".claude/**"
      - "LICENSE.txt"
      - ".pre-commit-config.yaml"
      - ".github/release-drafter.yml"
      - ".github/workflows/draft-release-notes.yml"
      - ".github/workflows/pre-commit.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

# A push to a pull request cancels any run in progress for an earlier push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --group test --no-dev
      # Without `--no-sync`, `uv run` would sync the environment with the dev group.
      # `-n auto` runs the tests in parallel on one pytest-xdist worker per CPU.
      # `--durations=30` reports the 30 slowest tests.
      - name: Run tests
        run: uv run --no-sync pytest -n auto --durations=30
