name: pre-commit

on:
  pull_request:
    branches:
      - master
  # The README badge shows the status of the latest run for a push to master.
  push:
    branches:
      - master

permissions:
  contents: read

# A push cancels any run in progress for an earlier push to the same pull request or
# branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure --color=always
